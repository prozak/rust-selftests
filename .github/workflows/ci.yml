name: ci

# Tier A: hermetic checks — no kernel, no LLVM, no build tree, no binary
# fixtures. Everything here runs from a bare checkout with pip-installable
# dependencies, in about a minute.
#
# The heavy gates (proving the real 550-object corpus, the QEMU runtime
# tests) need the pinned kernel tree and cannot run here; they live in
# `make ci-local` on a machine that has uml-harness/.build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet z3-solver pytest

      - name: Prover tests (synthetic objects, no kernel)
        run: python -m pytest equiv/tests -q

      - name: Python syntax check
        run: python -m compileall -q equiv scripts

      - name: Waivers file is well-formed
        run: |
          python - <<'PY'
          import sys
          bad = 0
          for n, line in enumerate(open("equiv/waivers.tsv"), 1):
              if line.startswith("#") or not line.strip():
                  continue
              parts = line.rstrip("\n").split("\t")
              if len(parts) != 3 or not all(p.strip() for p in parts):
                  print(f"waivers.tsv:{n}: expected 3 non-empty "
                        f"tab-separated fields, got {len(parts)}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Baseline is consistent
        run: |
          python - <<'PY'
          import sys
          seen, bad = set(), 0
          for n, line in enumerate(open("equiv/results/baseline.tsv"), 1):
              if line.startswith("#") or not line.strip():
                  continue
              f = line.rstrip("\n").split("\t")
              if len(f) != 6:
                  print(f"baseline.tsv:{n}: expected 6 fields, got {len(f)}")
                  bad = 1
                  continue
              if f[0] in seen:
                  print(f"baseline.tsv:{n}: duplicate row for {f[0]}")
                  bad = 1
              seen.add(f[0])
          print(f"{len(seen)} baseline rows")
          sys.exit(bad)
          PY
